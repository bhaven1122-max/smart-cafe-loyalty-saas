    let saasDB = JSON.parse(localStorage.getItem("multi_cafe_saas_db")) || initialSaaSData;
    let customerStamps = parseInt(localStorage.getItem("customer_stamps") || "0");

    function saveSaaS() {
      localStorage.setItem("multi_cafe_saas_db", JSON.stringify(saasDB));
    }

    const urlParams = new URLSearchParams(window.location.search);
    let activeCafeSlug = (urlParams.get("cafe") || "sukoon").toLowerCase();
    if (!saasDB.cafes[activeCafeSlug]) {
      activeCafeSlug = Object.keys(saasDB.cafes)[0] || "sukoon";
    }
    let currentTable = urlParams.get("table") || "1";

    function currentCafe() {
      return saasDB.cafes[activeCafeSlug];
    }

    let cart = {};
    let selectedCategory = "All";
    let searchQuery = "";
    let bestsellerOnly = false;
    let activeOrderId = localStorage.getItem("active_order_" + activeCafeSlug) || null;
    let cartStep = 0;
    let selectedNotes = [];
    let customNote = "";
    let customerName = "";
    let paymentMode = "COUNTER";
    let utrNumber = "";
    let soundEnabled = false;
    let pinUnlocked = false;
    let ownerTab = "sales";
    let showScannerModal = false;
    let isScanningMenu = false;
    let bulkMenuText = "";

    function getAutoFoodImage(nameOrCat) {
      const q = (nameOrCat || "").toLowerCase();
      if (q.includes("coffee") || q.includes("latte") || q.includes("frappe") || q.includes("shake")) return "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=500&q=80";
      if (q.includes("chai") || q.includes("tea") || q.includes("mojito") || q.includes("cooler")) return "https://images.unsplash.com/photo-1561336313-0bd5e0b27ec8?w=500&q=80";
      if (q.includes("burger") || q.includes("sandwich")) return "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=80";
      if (q.includes("pizza") || q.includes("pasta")) return "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&q=80";
      if (q.includes("momo") || q.includes("maggi") || q.includes("fries") || q.includes("chilli")) return "https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?w=500&q=80";
      if (q.includes("brownie") || q.includes("waffle") || q.includes("cake")) return "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=500&q=80";
      return "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=500&q=80";
    }

    window.addEventListener("storage", () => {
      const updated = JSON.parse(localStorage.getItem("multi_cafe_saas_db"));
      if (updated) {
        const oldLen = currentCafe().orders.length;
        saasDB = updated;
        const newLen = currentCafe().orders.length;
        if (newLen > oldLen && soundEnabled) playKitchenBell();
        render();
      }
    });

    function playKitchenBell() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = (freq, start, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
          gain.gain.setValueAtTime(0.4, ctx.currentTime + start);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + start);
          osc.stop(ctx.currentTime + start + duration);
        };
        playTone(880, 0, 0.35);
        playTone(660, 0.3, 0.6);
      } catch (e) {}
    }

    function getDiscountedPrice(price) {
      return currentCafe().rush_hour_discount ? Math.round(price * 0.9) : price;
    }

    function getRoute() {
      const mode = urlParams.get("mode");
      const hash = window.location.hash;
      if (mode === "superadmin" || hash === "#superadmin") return "SUPERADMIN";
      if (mode === "kitchen" || hash === "#kitchen-kds") return "KDS";
      if (mode === "owner" || hash === "#owner-boss") return "OWNER";
      return "CUSTOMER";
    }

    function renderScannerModal() {
      if (!showScannerModal) return "";
      return `
        <div class="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
          <div class="bg-white text-stone-900 w-full max-w-lg rounded-3xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center pb-3 border-b">
              <div>
                <h3 class="text-lg font-extrabold text-amber-700">📸 AI Menu Photo Scanner & Importer</h3>
                <p class="text-xs text-stone-500">Adding items to: <b>${currentCafe().cafe_name}</b></p>
              </div>
              <button onclick="showScannerModal=false; render()" class="text-stone-400 font-bold text-xl">✕</button>
            </div>
            <div class="my-4 p-4 bg-amber-50/70 border-2 border-amber-400 border-dashed rounded-2xl text-center">
              <p class="text-xs font-bold text-amber-900 mb-2">📷 पुराने मेन्यू कार्ड की फोटो अपलोड करें</p>
              <input type="password" placeholder="Optional: Gemini API Key" value="${saasDB.gemini_api_key || ''}" onchange="saasDB.gemini_api_key=this.value.trim(); saveSaaS()" class="w-full border rounded-xl px-3 py-1.5 text-xs mb-2.5 bg-white" />
              <label class="cursor-pointer inline-block bg-[#1C130E] text-amber-400 font-extrabold text-xs px-5 py-3 rounded-xl shadow">
                ${isScanningMenu ? '⏳ Scanning...' : 'Upload Photo'}
                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleMenuPhotoUpload(event)" ${isScanningMenu ? 'disabled' : ''} />
              </label>
            </div>
            <div class="my-3">
              <label class="text-xs font-extrabold text-stone-700">Bulk Menu List (Category | Name | Price)</label>
              <textarea id="bulkMenuInput" rows="5" oninput="bulkMenuText=this.value" placeholder="Coffee | Cold Coffee | 120" class="w-full border rounded-xl p-3 text-xs font-mono mt-1">${bulkMenuText}</textarea>
            </div>
            <div class="flex gap-2 mt-4">
              <button onclick="importBulkMenu(false)" class="flex-1 bg-amber-600 text-white font-extrabold py-3 rounded-xl text-xs">➕ Add Items</button>
              <button onclick="importBulkMenu(true)" class="flex-1 bg-[#1C130E] text-amber-400 font-extrabold py-3 rounded-xl text-xs">🔄 Replace Menu</button>
            </div>
          </div>
        </div>
      `;
    }

    async function handleMenuPhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (!saasDB.gemini_api_key) { alert("Gemini API Key डालें!"); return; }
      isScanningMenu = true; render();
      try {
        const base64Data = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(",")[1]);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${saasDB.gemini_api_key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: "Extract menu items as: Category | Name | Price" }, { inline_data: { mime_type: file.type || "image/jpeg", data: base64Data } }] }] })
        });
        const d = await res.json();
        bulkMenuText = d?.candidates?.[0]?.content?.parts?.[0]?.text || "";
      } catch (e) { alert("Scan failed"); }
      isScanningMenu = false; render();
    }

    function importBulkMenu(replace) {
      const raw = (document.getElementById("bulkMenuInput")?.value || bulkMenuText).trim();
      if (!raw) return alert("मेन्यू दें!");
      const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
      const newItems = lines.map((l, idx) => {
        let [cat, name, price] = l.includes("|") ? l.split("|").map(p => p.trim()) : ["Specials", l, "99"];
        return { id: Date.now() + idx, name: name || l, category: cat || "Specials", price: parseInt(price) || 99, is_veg: true, is_bestseller: idx < 2, in_stock: true, img: getAutoFoodImage(cat + " " + name) };
      });
      if (replace) currentCafe().menu = newItems;
      else currentCafe().menu = [...newItems, ...currentCafe().menu];
      saveSaaS(); showScannerModal = false; bulkMenuText = ""; alert("Success!"); render();
    }

            </div>
            <div class="space-y-4">
              ${cafeList.map(c => `

                    <button onclick="activeCafeSlug='${c.slug}'; showScannerModal=true; render()" class="bg-amber-500 text-black px-3 py-1.5 rounded-xl text-xs font-bold">📸 Scan Menu</button>

                    <div class="bg-stone-950 p-3 rounded-xl"><b>Menu:</b> <a href="${baseUrl}?cafe=${c.slug}&table=1" target="_blank" class="text-amber-400 underline">Open Link ↗</a></div>

                    <div class="bg-stone-950 p-3 rounded-xl"><b>Owner Panel:</b> <a href="${baseUrl}?cafe=${c.slug}&mode=owner" target="_blank" class="text-purple-400 underline">Open Link ↗</a></div>

              `).join('')}
            </div>

        ${renderScannerModal()}

    function createNewCafeClient() {
      const slug = (document.getElementById("newSlug").value || "").trim().toLowerCase().replace(/[^a-z0-9]/g, "");
      const name = (document.getElementById("newName").value || "").trim();
      const upi = (document.getElementById("newUpi").value || "").trim() || "merchant@upi";
      const phone = (document.getElementById("newPhone").value || "").trim() || "919876543210";
      if (!slug || !name) return alert("Fill ID and Name");
      if (saasDB.cafes[slug]) return alert("ID exists");
      saasDB.cafes[slug] = {
        slug, is_active: true, cafe_name: name, tagline: "Fast Table Ordering", upi_id: upi, whatsapp_number: phone,
        chef_pin: "1122", owner_pin: "8899", total_tables: 12, google_review_link: "https://google.com",
        rush_hour_discount: false, loyalty_target: 5, loyalty_reward: "Free Dessert or Coffee",
        menu: JSON.parse(JSON.stringify(defaultMenuTemplate)), orders: []
      };
      saveSaaS(); render();
    }

        </header>

        <main class="max-w-xl mx-auto px-4 pt-4">
          ${activeOrder ? `
            <div class="mb-6 bg-white rounded-2xl p-4 shadow border-2 border-amber-500">
              <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full">Order #${activeOrder.order_number} • Table ${activeOrder.table_number}</span>
                <button onclick="activeOrderId=null; localStorage.removeItem('active_order_'+activeCafeSlug); render()" class="text-xs text-stone-400 underline">Dismiss</button>

                <div class="p-2 rounded-xl ${activeOrder.order_status === 'ready' ? 'bg-green-600 text-white font-bold' : 'bg-stone-100'}">3. Ready</div>
              </div>
              <a href="${cafe.google_review_link}" target="_blank" class="block text-center bg-amber-100 text-amber-900 border border-amber-400 text-xs font-bold py-2.5 rounded-xl mt-3">⭐ Rate us on Google & Get Rewards!</a>

          ` : ''}

          <div class="flex gap-2 mb-3">
            <input type="text" placeholder="Search..." value="${searchQuery}" oninput="searchQuery=this.value; render()" class="flex-1 bg-white px-4 py-2 rounded-xl border text-sm" />

                  </div>
                  <div>
                    ${inCart === 0 ? `<button onclick="updateCart(${item.id}, 1)" class="bg-amber-50 text-amber-800 border border-amber-500 font-bold text-xs px-4 py-2 rounded-xl">+ ADD</button>` : `<div class="flex items-center bg-[#1C130E] text-white rounded-xl"><button onclick="updateCart(${item.id}, -1)" class="px-3 py-1.5 font-bold text-amber-400">-</button><span class="px-2 text-xs font-bold">${inCart}</span><button onclick="updateCart(${item.id}, 1)" class="px-3 py-1.5 font-bold text-amber-400">+</button></div>`}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </main>

        ${totalQty > 0 ? `<button onclick="cartStep=1; render()" class="fixed left-4 bottom-4 z-40 bg-[#1C130E] text-white px-5 py-3.5 rounded-2xl shadow-2xl border-2 border-amber-500 flex items-center gap-3"><span>${totalQty} Items • ₹${grandTotal}</span><span class="text-amber-400 font-extrabold">View Cart ➔</span></button>` : ''}

        ${cartStep > 0 ? `
          <div class="fixed inset-0 z-50 bg-black/60 flex items-end justify-center p-0 sm:p-4">
            <div class="bg-white w-full max-w-lg rounded-t-3xl p-5">
              ${cartStep === 1 ? `
                <div class="flex justify-between items-center pb-3 border-b"><h2 class="font-extrabold text-base">Review Order (Table #${currentTable})</h2><button onclick="cartStep=0; render()" class="text-xl">✕</button></div>
                <div class="divide-y my-3 max-h-60 overflow-y-auto">
                  ${cartItems.map(i => `<div class="py-2 flex justify-between text-sm"><span>${i.qty}x ${i.name}</span><b>₹${getDiscountedPrice(i.price) * i.qty}</b></div>`).join('')}
                </div>
                <input type="text" placeholder="Your Name (Optional)" value="${customerName}" oninput="customerName=this.value" class="w-full border rounded-xl px-3 py-2 text-xs mb-3" />
                <button onclick="cartStep=2; render()" class="w-full bg-amber-600 text-white font-extrabold py-3 rounded-xl text-xs">Proceed to Pay ➔</button>
              ` : `
                <div class="flex justify-between items-center pb-3 border-b"><h2 class="font-extrabold text-base">Payment & Confirm</h2><button onclick="cartStep=1; render()" class="text-xs text-amber-700 font-bold">← Back</button></div>
                <div class="my-4 space-y-2 text-xs">
                  <label class="flex items-center gap-3 p-3 border rounded-xl cursor-pointer"><input type="radio" name="pay" checked onchange="paymentMode='COUNTER'" /> Pay at Counter after meal</label>
                  <label class="flex items-center gap-3 p-3 border rounded-xl cursor-pointer"><input type="radio" name="pay" onchange="paymentMode='UPI'" /> Pay Now via UPI (₹${grandTotal})</label>
                </div>
                <button onclick="placeFinalOrder(${subtotal}, ${grandTotal})" class="w-full bg-[#1C130E] text-amber-400 font-extrabold py-3.5 rounded-xl text-sm">🔔 Send to Kitchen</button>
              `}
            </div>
          </div>
        ` : ''}
      `;
    }

    function updateCart(id, delta) {
      const item = currentCafe().menu.find(x => x.id === id);
      if (!item) return;
      if (!cart[id]) cart[id] = { ...item, qty: 0 };
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];
      render();
    }

    function placeFinalOrder(subtotal, total) {
      const cafe = currentCafe();
      const newOrder = {
        id: "ord_" + Date.now(), order_number: Math.floor(100 + Math.random() * 900), table_number: currentTable,
        customer_name: customerName || "Guest", items: Object.values(cart).map(i => ({ name: i.name, price: getDiscountedPrice(i.price), qty: i.qty })),
        total_amount: total, payment_method: paymentMode, order_status: "new", created_at: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      cafe.orders.unshift(newOrder);
      activeOrderId = newOrder.id;
      localStorage.setItem("active_order_" + activeCafeSlug, activeOrderId);
      
      // Give Loyalty Stamp!
      customerStamps += 1;
      localStorage.setItem("customer_stamps", customerStamps);

      cart = {}; cartStep = 0; saveSaaS(); render();
    }

    function renderKDS() {
      const cafe = currentCafe();
      if (!pinUnlocked) {
        return `
          <div class="min-h-screen bg-[#1C130E] text-white flex items-center justify-center p-4">
            <div class="bg-stone-900 p-6 rounded-3xl max-w-sm w-full text-center border">
              <h2 class="text-lg font-extrabold text-amber-400 mb-2">Kitchen KDS</h2>
              <input id="pinInput" type="password" maxlength="4" placeholder="PIN" class="w-full text-center text-xl bg-stone-800 rounded-xl py-2 mb-3 text-white border" />
              <button onclick="if(document.getElementById('pinInput').value === '${cafe.chef_pin}'){pinUnlocked=true; render();}else{alert('Wrong PIN');}" class="w-full bg-amber-600 py-2.5 rounded-xl font-bold">Unlock</button>
            </div>
          </div>
        `;
      }
      return `
        <div class="min-h-screen bg-stone-950 text-white p-4">
          <div class="flex justify-between items-center pb-4 border-b border-stone-800">
            <h1 class="text-xl font-extrabold text-amber-400">👨‍🍳 Kitchen KDS (${cafe.cafe_name})</h1>
            <button onclick="soundEnabled=!soundEnabled; render()" class="bg-stone-800 px-3 py-1.5 rounded-xl text-xs font-bold">${soundEnabled ? '🔊 Sound ON' : '🔇 Enable Sound'}</button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
            ${cafe.orders.map(o => `
              <div class="bg-stone-900 rounded-2xl p-4 border-2 ${o.order_status === 'new' ? 'border-red-500 animate-pulse' : 'border-stone-800'}">
                <div class="flex justify-between font-extrabold text-amber-400 mb-2"><span>Table #${o.table_number}</span><span>#${o.order_number}</span></div>
                <div class="divide-y divide-stone-800 text-sm mb-3">${o.items.map(i => `<div class="py-1">${i.qty}x ${i.name}</div>`).join('')}</div>
                ${o.order_status === 'new' ? `<button onclick="updateOrderStatus('${o.id}', 'preparing')" class="w-full bg-amber-600 text-white py-2 rounded-xl text-xs font-bold">Start Preparing</button>` : o.order_status === 'preparing' ? `<button onclick="updateOrderStatus('${o.id}', 'ready')" class="w-full bg-green-600 text-white py-2 rounded-xl text-xs font-bold">Mark Ready</button>` : `<span class="block text-center text-green-400 text-xs font-bold">✔ Completed</span>`}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function updateOrderStatus(id, st) {
      const o = currentCafe().orders.find(x => x.id === id);
      if (o) { o.order_status = st; saveSaaS(); render(); }
    }

    function renderOwner() {
      const cafe = currentCafe();
      if (!pinUnlocked) {
        return `
          <div class="min-h-screen bg-[#1C130E] text-white flex items-center justify-center p-4">
            <div class="bg-stone-900 p-6 rounded-3xl max-w-sm w-full text-center border">
              <h2 class="text-lg font-extrabold text-amber-400 mb-2">Owner Panel</h2>
              <input id="ownerPin" type="password" maxlength="4" placeholder="PIN" class="w-full text-center text-xl bg-stone-800 rounded-xl py-2 mb-3 text-white border" />
              <button onclick="if(document.getElementById('ownerPin').value === '${cafe.owner_pin}'){pinUnlocked=true; render();}else{alert('Wrong PIN');}" class="w-full bg-amber-600 py-2.5 rounded-xl font-bold">Unlock</button>
            </div>
          </div>
        `;
      }
      const totalRev = cafe.orders.reduce((s, o) => s + o.total_amount, 0);

      return `
        <div class="max-w-4xl mx-auto p-4">
          <div class="bg-[#1C130E] text-white p-4 rounded-2xl flex justify-between items-center mb-4">
            <h1 class="font-extrabold text-amber-400">👑 ${cafe.cafe_name} Owner Panel</h1>
            <div class="flex gap-2">
              <button onclick="ownerTab='sales'; render()" class="px-3 py-1.5 rounded-xl text-xs font-bold ${ownerTab==='sales'?'bg-amber-500 text-black':'bg-stone-800'}">Sales</button>
              <button onclick="ownerTab='loyalty'; render()" class="px-3 py-1.5 rounded-xl text-xs font-bold ${ownerTab==='loyalty'?'bg-amber-500 text-black':'bg-stone-800'}">🎁 Loyalty Setup</button>
            </div>
          </div>
          ${ownerTab === 'sales' ? `
            <div class="bg-white p-4 rounded-2xl border mb-4"><b>Total Revenue: ₹${totalRev}</b> (${cafe.orders.length} Orders)</div>
            <div class="bg-white rounded-2xl p-4 border space-y-2">
              <h3 class="font-bold text-sm">Permanent Order History</h3>
              ${cafe.orders.map(o => `<div class="py-2 border-b flex justify-between text-xs"><span>Table #${o.table_number} • ${o.items.map(x=>x.name).join(', ')}</span><b>₹${o.total_amount}</b></div>`).join('')}
            </div>
          ` : `
            <div class="bg-white p-5 rounded-2xl border space-y-3 text-xs">
              <h3 class="font-extrabold text-sm">🎁 Loyalty Stamp Reward Setup</h3>
              <div><label class="font-bold">Stamps needed for Free Reward:</label><input type="number" value="${cafe.loyalty_target}" onchange="cafe.loyalty_target=parseInt(this.value)||5; saveSaaS()" class="w-full border rounded-xl p-2 mt-1" /></div>
              <div><label class="font-bold">Free Reward Description:</label><input type="text" value="${cafe.loyalty_reward}" onchange="cafe.loyalty_reward=this.value; saveSaaS()" class="w-full border rounded-xl p-2 mt-1" /></div>
            </div>
          `}
        </div>
      `;
    }

    function render() {
      const route = getRoute();
      const root = document.getElementById("app");
      if (route === "SUPERADMIN") root.innerHTML = renderSuperAdmin();
      else if (route === "KDS") root.innerHTML = renderKDS();
      else if (route === "OWNER") root.innerHTML = renderOwner();
      else root.innerHTML = renderCustomer();
    }

    window.addEventListener("hashchange", () => { pinUnlocked = false; render(); });
    render();
  </script>
</body>
</html>
